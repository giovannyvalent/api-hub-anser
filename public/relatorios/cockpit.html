<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit — Anser Data Hub</title>
<style>
  :root {
    --bg:            #0a0a0b;
    --panel:         #131316;
    --panel-2:       #1a1a1f;
    --border:        #2a2a30;
    --text-primary:  #f2f2f0;
    --text-secondary:#9a9aa2;
    --text-muted:    #5f5f68;
    --good:          #0ca30c;
    --good-glow:     #17e617;
    --warning:       #fab219;
    --critical:      #e6342f;
    --blue:          #2a9df4;
    --track:         #24242b;
    --grid:          #1e1e24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { padding: 1.25rem 1rem 3rem; }
  .container { max-width: 1150px; margin: 0 auto; }

  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.6rem; }
  header .title { display: flex; align-items: center; gap: 0.6rem; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--critical); box-shadow: 0 0 8px var(--critical); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .clock { font-size: 1.1rem; color: var(--text-secondary); }

  .gauge-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.9rem; margin-bottom: 1rem; }
  .gauge {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem;
  }
  .gauge .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.3rem; }
  .gauge .value { font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .gauge .unit { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; margin-left: 0.3rem; }
  .gauge .bar-track { height: 8px; border-radius: 4px; background: var(--track); margin-top: 0.7rem; overflow: hidden; }
  .gauge .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background 0.4s ease; }
  .sparkline { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 0.6rem; }
  .sparkline .bar { flex: 1; background: var(--blue); border-radius: 1px 1px 0 0; min-height: 2px; transition: height 0.3s ease; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 0 0 0.8rem 0; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .status-banner { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .status-pill {
    flex: 1; min-width: 150px; display: flex; align-items: center; gap: 0.6rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem;
  }
  .status-pill .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .status-pill .dot.importing { background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: pulse 1.2s ease-in-out infinite; }
  .status-pill .dot.done { background: var(--good); }
  .status-pill .dot.error { background: var(--critical); box-shadow: 0 0 8px var(--critical); }
  .status-pill .dot.idle { background: var(--text-muted); }
  .status-pill .n { font-size: 1.5rem; font-weight: 700; }
  .status-pill .l { font-size: 0.75rem; color: var(--text-secondary); }

  .importing-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .importing-row {
    display: flex; align-items: center; gap: 0.8rem; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.9rem; flex-wrap: wrap;
  }
  .importing-row .led { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: pulse 1.2s ease-in-out infinite; flex-shrink: 0; }
  .importing-row .company { font-weight: 700; min-width: 160px; }
  .importing-row .resource { color: var(--text-secondary); font-size: 0.88rem; flex: 1; }
  .importing-row .ago { color: var(--text-muted); font-size: 0.8rem; }
  .empty-msg { color: var(--text-muted); font-size: 0.88rem; padding: 0.4rem 0; }

  .grid-legend { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 0.8rem; font-size: 0.78rem; color: var(--text-secondary); }
  .grid-legend .item { display: flex; align-items: center; gap: 0.4rem; }
  .grid-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .grid-companies { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.5rem; }
  .company-chip {
    display: flex; align-items: center; gap: 0.5rem; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.82rem;
  }
  .company-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .company-chip .dot.importing { background: var(--blue); box-shadow: 0 0 6px var(--blue); animation: pulse 1.2s ease-in-out infinite; }
  .company-chip .dot.done { background: var(--good); }
  .company-chip .dot.idle { background: var(--text-muted); }
  .company-chip .dot.error { background: var(--critical); box-shadow: 0 0 6px var(--critical); }
  .company-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log {
    background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.78rem; line-height: 1.65;
    height: 320px; overflow-y: auto;
  }
  .log-line { display: flex; gap: 0.6rem; white-space: nowrap; overflow: hidden; }
  .log-line .t { color: var(--text-muted); }
  .log-line .c { color: var(--blue); overflow: hidden; text-overflow: ellipsis; min-width: 120px; max-width: 180px; }
  .log-line .r { color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .log-line .n { color: var(--good); }
  .log-line.err .n { color: var(--critical); }
  .log-line.fresh { animation: flash 0.5s ease; }
  @keyframes flash { from { background: rgba(255,255,255,0.08); } to { background: transparent; } }

  .state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
  .state.error { color: var(--critical); }
  footer { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title">
      <span class="rec-dot"></span>
      <h1>🏎 Cockpit — Anser Data Hub</h1>
    </div>
    <div class="clock num" id="clock">--:--:--</div>
  </header>

  <div id="loading" class="state">Ligando telemetria...</div>
  <div id="error" class="state error" style="display:none"></div>

  <div id="content" style="display:none">
    <div class="gauge-row">
      <div class="gauge">
        <div class="label">Throughput</div>
        <div class="value num"><span id="g-throughput">0</span><span class="unit">reg/s</span></div>
        <div class="sparkline" id="g-spark"></div>
      </div>
      <div class="gauge">
        <div class="label">Syncs / min</div>
        <div class="value num"><span id="g-syncsmin">0</span></div>
        <div class="bar-track"><div class="bar-fill" id="g-syncsmin-bar" style="width:0%;background:var(--blue)"></div></div>
      </div>
      <div class="gauge">
        <div class="label">Empresas ativas</div>
        <div class="value num"><span id="g-companies">0</span></div>
        <div class="bar-track"><div class="bar-fill" id="g-companies-bar" style="width:100%;background:var(--good)"></div></div>
      </div>
      <div class="gauge">
        <div class="label">Erros (1h)</div>
        <div class="value num"><span id="g-errors">0</span></div>
        <div class="bar-track"><div class="bar-fill" id="g-errors-bar" style="width:0%;background:var(--good)"></div></div>
      </div>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <div class="panel">
      <h2>Importando agora (full sync em andamento)</h2>
      <div class="importing-list" id="importing-list"></div>
    </div>

    <div class="panel">
      <h2>Fila — status por empresa</h2>
      <div class="grid-legend">
        <span class="item"><span class="dot" style="background:var(--blue)"></span>importando agora</span>
        <span class="item"><span class="dot" style="background:var(--good)"></span>em dia</span>
        <span class="item"><span class="dot" style="background:var(--critical)"></span>erro recente</span>
        <span class="item"><span class="dot" style="background:var(--text-muted)"></span>sem atividade recente</span>
      </div>
      <div class="grid-companies" id="companies-grid"></div>
    </div>

    <div class="panel">
      <h2>Telemetria ao vivo</h2>
      <div id="log"></div>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const HUB_KEY = "fe629d8070ea1e02b8e212a620cae15e036a9675e22a3647e130d688233706ed"; // read-only
const POLL_MS = 4000;
const FEED_LIMIT = 1000; // maximo aceito pela API — evita empresa sumir do radar em picos de atividade
const SPARK_HISTORY = 24;

async function api(path) {
  const res = await fetch(path, { headers: { "x-api-key": HUB_KEY } });
  if (!res.ok) throw new Error(`HTTP ${res.status} em ${path}`);
  return (await res.json()).data;
}

function tick2(n) { return String(n).padStart(2, "0"); }
function updateClock() {
  const d = new Date();
  document.getElementById("clock").textContent = `${tick2(d.getHours())}:${tick2(d.getMinutes())}:${tick2(d.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

function timeAgo(iso) {
  const secs = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (secs < 5) return "agora";
  if (secs < 60) return `${secs}s atrás`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}min atrás`;
  return `${Math.floor(mins / 60)}h atrás`;
}

let companyNames = {};
let seenLogIds = null;
let lastPollAt = null;
let sparkHistory = [];

async function loadCompanies() {
  const companies = await api("/api/companies?active=true");
  companyNames = Object.fromEntries(companies.map((c) => [c.id, c.name]));
}

function severityColor(pct) {
  if (pct < 0.5) return "var(--good)";
  if (pct < 0.8) return "var(--warning)";
  return "var(--critical)";
}

function renderSpark(el, values) {
  const max = Math.max(...values, 1);
  el.innerHTML = values
    .map((v) => `<div class="bar" style="height:${Math.max(6, (v / max) * 100)}%"></div>`)
    .join("");
}

function renderGauges(logs, throughput) {
  document.getElementById("g-throughput").textContent = throughput.toFixed(1);
  sparkHistory.push(throughput);
  if (sparkHistory.length > SPARK_HISTORY) sparkHistory.shift();
  renderSpark(document.getElementById("g-spark"), sparkHistory);

  const now = Date.now();
  const lastMin = logs.filter((l) => now - new Date(l.finished_at).getTime() < 60000);
  document.getElementById("g-syncsmin").textContent = lastMin.length;
  const syncsPct = Math.min(1, lastMin.length / 40);
  document.getElementById("g-syncsmin-bar").style.width = `${syncsPct * 100}%`;

  document.getElementById("g-companies").textContent = Object.keys(companyNames).length;

  const lastHour = logs.filter((l) => now - new Date(l.finished_at).getTime() < 3600000);
  const errors = lastHour.filter((l) => l.status === "error");
  document.getElementById("g-errors").textContent = errors.length;
  const errBar = document.getElementById("g-errors-bar");
  errBar.style.width = `${Math.min(100, errors.length * 10)}%`;
  errBar.style.background = errors.length === 0 ? "var(--good)" : "var(--critical)";
}

// Classificação única por empresa, usada no banner, na lista "importando
// agora" e no grid — pra nunca ficar duas partes do cockpit contando coisas
// diferentes. Categorias:
//  - error: teve erro entre as ultimas 8 execuções e ainda não teve sucesso
//    depois dele nesse mesmo recurso.
//  - importing: teve full sync (onboarding) nos últimos 3min — não é só
//    "tocou agora", é especificamente "está sendo importada de verdade".
//  - done: teve QUALQUER sync com sucesso dentro da janela do cron
//    incremental (~20min, com folga) — já está em dia.
//  - idle: nunca sincronizou, ou faz mais de 20min que não sincroniza.
function classifyCompanies(logs) {
  const now = Date.now();
  const result = {};
  for (const id of Object.keys(companyNames)) {
    const companyLogs = logs.filter((l) => l.company_id === id);
    const mostRecent = companyLogs[0];
    const hasRecentError = companyLogs.slice(0, 8).some((l) => l.status === "error");
    const importingLog = companyLogs.find((l) => l.mode === "full" && now - new Date(l.finished_at).getTime() < 3 * 60 * 1000);

    let category = "idle";
    if (hasRecentError) category = "error";
    else if (importingLog) category = "importing";
    else if (mostRecent && now - new Date(mostRecent.finished_at).getTime() < 20 * 60 * 1000) category = "done";

    result[id] = { category, mostRecent, importingLog };
  }
  return result;
}

function renderStatusBanner(classification) {
  const counts = { importing: 0, done: 0, error: 0, idle: 0 };
  for (const c of Object.values(classification)) counts[c.category]++;
  const pills = [
    ["importing", "Importando agora", counts.importing],
    ["done", "Em dia", counts.done],
    ["error", "Com erro", counts.error],
    ["idle", "Sem atividade recente", counts.idle],
  ];
  document.getElementById("status-banner").innerHTML = pills
    .map(([cls, label, n]) => `<div class="status-pill"><span class="dot ${cls}"></span><div><div class="n num">${n}</div><div class="l">${label}</div></div></div>`)
    .join("");
}

function renderImportingList(classification) {
  const rows = Object.entries(classification)
    .filter(([, c]) => c.category === "importing")
    .map(([id, c]) => {
      const l = c.importingLog;
      const status = l.status === "success" ? `${(l.records_synced ?? 0).toLocaleString("pt-BR")} registros` : "ERRO";
      return `<div class="importing-row">
        <span class="led"></span>
        <span class="company">${companyNames[id]}</span>
        <span class="resource">${l.resource} — ${status}</span>
        <span class="ago num">${timeAgo(l.finished_at)}</span>
      </div>`;
    });
  document.getElementById("importing-list").innerHTML =
    rows.length > 0 ? rows.join("") : `<div class="empty-msg">Nenhuma importação em andamento agora — só sync incremental de rotina.</div>`;
}

function renderCompanyGrid(classification) {
  const rows = Object.entries(companyNames).map(([id, name]) => {
    const dotClass = classification[id]?.category ?? "idle";
    return `<div class="company-chip"><span class="dot ${dotClass}"></span><span class="name" title="${name}">${name}</span></div>`;
  });
  document.getElementById("companies-grid").innerHTML = rows.join("");
}

function renderLog(logs) {
  const top = logs.slice(0, 60);
  const isFirstRender = seenLogIds === null;
  const seenBefore = seenLogIds ?? new Set();

  document.getElementById("log").innerHTML = top
    .map((l) => {
      const isFresh = !isFirstRender && !seenBefore.has(l.id);
      const ok = l.status === "success";
      return `<div class="log-line ${ok ? "" : "err"} ${isFresh ? "fresh" : ""}">
        <span class="t">${new Date(l.finished_at).toLocaleTimeString("pt-BR")}</span>
        <span class="c">${companyNames[l.company_id] || "—"}</span>
        <span class="r">${l.resource}/${l.mode}</span>
        <span class="n">${ok ? (l.records_synced ?? 0).toLocaleString("pt-BR") : "ERR"}</span>
      </div>`;
    })
    .join("");
  seenLogIds = new Set(top.map((l) => l.id));
}

async function tick() {
  try {
    const logs = await api(`/api/data/nibo/sync-logs?limit=${FEED_LIMIT}`);
    const now = Date.now();

    let throughput = 0;
    if (lastPollAt !== null) {
      const newOnes = logs.filter((l) => new Date(l.finished_at).getTime() > lastPollAt);
      const sum = newOnes.reduce((s, l) => s + (l.records_synced || 0), 0);
      throughput = sum / (POLL_MS / 1000);
    }
    lastPollAt = now;

    const classification = classifyCompanies(logs);

    renderGauges(logs, throughput);
    renderStatusBanner(classification);
    renderImportingList(classification);
    renderCompanyGrid(classification);
    renderLog(logs);

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("footer").textContent = `Última leitura: ${new Date().toLocaleTimeString("pt-BR")} · atualiza a cada ${POLL_MS / 1000}s`;
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    const errEl = document.getElementById("error");
    errEl.style.display = "block";
    errEl.textContent = `Telemetria offline: ${err.message}`;
  }
}

async function main() {
  try {
    await loadCompanies();
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("error").style.display = "block";
    document.getElementById("error").textContent = `Não foi possível carregar empresas: ${err.message}`;
    return;
  }
  await tick();
  setInterval(async () => {
    try { await loadCompanies(); } catch (e) {}
    tick();
  }, POLL_MS);
}
main();
</script>
</body>
</html>
